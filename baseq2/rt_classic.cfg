// Quake II RT Classic - recommended defaults
// Vanilla Quake II art stays in control; path tracing supplies the lighting.

seta rt_classic "1"
seta rt_original_textures "1"
seta rt_original_models "1"
seta rt_classic_materials "1"
seta sv_flaregun "0"

seta rt_bounce_strength "0.5"
seta rt_reflections "1"
seta rt_reflection_strength "0.25"
seta rt_emissive_strength "1.0"

// One full-resolution GI bounce keeps the lighting stable while the RT
// Classic scalar above restrains its contribution.
seta pt_num_bounce_rays "1"
seta pt_reflect_refract "1"
seta pt_direct_polygon_lights "1"
seta pt_direct_dyn_lights "1"
seta pt_direct_sun_light "1"
seta pt_indirect_polygon_lights "1"
seta pt_indirect_dyn_lights "1"
seta pt_enable_surface_lights "1"

// Vanilla textures do not contain authored normal or metallic channels.
seta pt_bump_scale "0"
seta pt_nearest "2"
seta pt_metallic_override "-1"
seta pt_roughness_override "-1"

// Keep post processing from overpowering the original palette.
seta bloom_intensity "0.001"
seta bloom_intensity_water "0.1"
seta flt_fsr_sharpness "0.2"
// Use the physical atmosphere for an unmistakable moving ray-traced sun,
// dynamic sky illumination, volumetric shafts, and time-of-day changes. The
// world, model, and HUD artwork still comes from the original Quake II data.
seta physical_sky "1"
seta physical_sky_draw_clouds "1"
seta physical_sky_brightness "0.0"
seta sun_preset "5"
seta sun_brightness "3.0"

// TuinRTX quick controls.
bind / "next_sun"
bind f "toggle cl_flashlight"
